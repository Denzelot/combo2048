<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Combo 2048</title>
<style>
  :root {
    --bg: #1a1a2e;
    --panel: #16213e;
    --board-bg: #0f3460;
    --cell-bg: rgba(255,255,255,0.06);
    --text: #eaeaea;
    --muted: #9aa5c9;
    --accent: #e94560;
    --accent2: #ffd166;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: radial-gradient(circle at 50% 0%, #24243e, var(--bg) 60%);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow-x: hidden;
    user-select: none;
    touch-action: none;
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }
  header {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 14px;
  }
  h1 {
    font-size: 32px;
    margin: 0;
    font-weight: 800;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .subtitle { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .scores { display: flex; gap: 8px; }
  .score-box {
    background: var(--panel);
    border-radius: 10px;
    padding: 8px 14px;
    text-align: center;
    min-width: 68px;
  }
  .score-box .label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .score-box .value { font-size: 20px; font-weight: 700; }
  .toolbar {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .combo-display {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 34px;
  }
  .combo-badge {
    background: linear-gradient(135deg, var(--accent), #ff7b9c);
    color: white;
    font-weight: 800;
    font-size: 14px;
    padding: 5px 12px;
    border-radius: 20px;
    opacity: 0;
    transform: scale(0.7);
    transition: all 0.25s cubic-bezier(.34,1.56,.64,1);
    box-shadow: 0 4px 12px rgba(233,69,96,0.4);
  }
  .combo-badge.show { opacity: 1; transform: scale(1); }
  .combo-badge.pulse { animation: pulse 0.35s ease; }
  @keyframes pulse { 0% { transform: scale(1.3); } 100% { transform: scale(1); } }
  button.newgame {
    background: var(--accent);
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: transform 0.1s, background 0.2s;
  }
  button.newgame:hover { background: #ff5c7a; }
  button.newgame:active { transform: scale(0.95); }

  .board-container {
    position: relative;
    width: 100%;
    max-width: 420px;
    aspect-ratio: 1 / 1;
  }
  .board {
    position: relative;
    width: 100%;
    height: 100%;
    background: var(--board-bg);
    border-radius: 14px;
    padding: 10px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4), inset 0 0 0 1px rgba(255,255,255,0.05);
  }
  .cell-bg {
    background: var(--cell-bg);
    border-radius: 8px;
  }
  .tile-layer {
    position: absolute;
    top: 10px; left: 10px; right: 10px; bottom: 10px;
  }
  .tile {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    font-weight: 800;
    color: #1a1a2e;
    transition: left 0.12s ease, top 0.12s ease, transform 0.12s ease;
    will-change: left, top, transform;
  }
  .tile.new-tile { animation: spawn 0.18s ease; }
  .tile.merged-tile { animation: merge-pop 0.22s ease; z-index: 5; }
  @keyframes spawn {
    from { transform: scale(0); }
    to { transform: scale(1); }
  }
  @keyframes merge-pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.18); }
    100% { transform: scale(1); }
  }

  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(15, 15, 30, 0.88);
    border-radius: 14px;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    z-index: 20;
    text-align: center;
    padding: 20px;
  }
  .overlay.show { display: flex; }
  .overlay h2 { font-size: 28px; margin: 0; }
  .overlay p { color: var(--muted); margin: 0; font-size: 14px; }
  .overlay button {
    background: var(--accent2);
    color: #1a1a2e;
    border: none;
    padding: 10px 22px;
    border-radius: 10px;
    font-weight: 800;
    cursor: pointer;
  }

  .hint {
    margin-top: 16px;
    color: var(--muted);
    font-size: 12px;
    text-align: center;
    line-height: 1.6;
  }
  .hint b { color: var(--text); }

  @media (max-width: 380px) {
    h1 { font-size: 26px; }
    .score-box { min-width: 56px; padding: 6px 10px; }
    .score-box .value { font-size: 16px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Combo 2048</h1>
      <div class="subtitle">Encadena fusiones para multiplicar puntos</div>
    </div>
    <div class="scores">
      <div class="score-box">
        <div class="label">Puntos</div>
        <div class="value" id="score">0</div>
      </div>
      <div class="score-box">
        <div class="label">Mejor</div>
        <div class="value" id="best">0</div>
      </div>
    </div>
  </header>

  <div class="toolbar">
    <div class="combo-display">
      <div class="combo-badge" id="comboBadge">Combo x1</div>
    </div>
    <button class="newgame" id="newGameBtn">Nuevo juego</button>
  </div>

  <div class="board-container">
    <div class="board" id="board">
      <!-- 16 background cells -->
      <div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div>
      <div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div>
      <div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div>
      <div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div>
      <div class="tile-layer" id="tileLayer"></div>
    </div>
    <div class="overlay" id="overlay">
      <h2 id="overlayTitle">¡Juego terminado!</h2>
      <p id="overlaySub">Tu mejor combo: x1</p>
      <button id="overlayBtn">Intentar de nuevo</button>
    </div>
  </div>

  <div class="hint">
    Usa las <b>flechas del teclado</b> (o desliza en pantalla táctil) para mover las fichas.<br>
    Cada fusión seguida sube tu <b>combo</b>. Un movimiento sin fusión lo reinicia.
  </div>
</div>

<script>
(function () {
  const SIZE = 4;
  const TILE_COLORS = {
    2: '#eee4da', 4: '#ede0c8', 8: '#f2b179', 16: '#f59563',
    32: '#f67c5f', 64: '#f65e3b', 128: '#edcf72', 256: '#edcc61',
    512: '#edc850', 1024: '#edc53f', 2048: '#edc22e', 4096: '#3c3a32', 8192: '#3c3a32'
  };
  const TILE_TEXT_LIGHT = new Set([4096, 8192]);

  const boardEl = document.getElementById('board');
  const tileLayer = document.getElementById('tileLayer');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const comboBadge = document.getElementById('comboBadge');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlaySub = document.getElementById('overlaySub');
  const overlayBtn = document.getElementById('overlayBtn');
  const newGameBtn = document.getElementById('newGameBtn');

  const storage = {
    get(key) {
      try { return localStorage.getItem(key); } catch (e) { return null; }
    },
    set(key, value) {
      try { localStorage.setItem(key, value); } catch (e) { /* storage unavailable */ }
    }
  };

  let grid; // grid[r][c] = {value, id} or null
  let score = 0;
  let best = parseInt(storage.get('combo2048_best') || '0', 10);
  let bestCombo = 1;
  let combo = 1;
  let tileIdCounter = 1;
  let won = false;
  let gameOver = false;
  let animating = false;

  bestEl.textContent = best;

  function emptyGrid() {
    return Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
  }

  function cellSize() {
    const boardRect = boardEl.getBoundingClientRect();
    const inner = boardRect.width - 20; // padding 10 each side
    const gap = 10;
    return (inner - gap * (SIZE - 1)) / SIZE;
  }

  function cellPos(r, c) {
    const cs = cellSize();
    const gap = 10;
    return { x: c * (cs + gap), y: r * (cs + gap), size: cs };
  }

  function randomEmptyCell() {
    const empties = [];
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (!grid[r][c]) empties.push([r, c]);
    if (empties.length === 0) return null;
    return empties[Math.floor(Math.random() * empties.length)];
  }

  function spawnTile(isInitial) {
    const cell = randomEmptyCell();
    if (!cell) return;
    const [r, c] = cell;
    const value = Math.random() < 0.9 ? 2 : 4;
    grid[r][c] = { value, id: tileIdCounter++, isNew: !isInitial, merged: false };
  }

  function startGame() {
    grid = emptyGrid();
    score = 0;
    combo = 1;
    bestCombo = 1;
    won = false;
    gameOver = false;
    animating = false;
    overlay.classList.remove('show');
    updateComboBadge(false);
    spawnTile(true);
    spawnTile(true);
    render(true);
    updateScore();
  }

  function updateScore() {
    scoreEl.textContent = score;
    if (score > best) {
      best = score;
      storage.set('combo2048_best', String(best));
    }
    bestEl.textContent = best;
  }

  function updateComboBadge(pulse) {
    if (combo > 1) {
      comboBadge.textContent = 'Combo x' + combo;
      comboBadge.classList.add('show');
      if (pulse) {
        comboBadge.classList.remove('pulse');
        void comboBadge.offsetWidth;
        comboBadge.classList.add('pulse');
      }
    } else {
      comboBadge.classList.remove('show');
    }
  }

  function render(skipAnim) {
    tileLayer.innerHTML = '';
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const t = grid[r][c];
        if (!t) continue;
        const el = document.createElement('div');
        el.className = 'tile';
        const pos = cellPos(r, c);
        el.style.width = pos.size + 'px';
        el.style.height = pos.size + 'px';
        el.style.left = pos.x + 'px';
        el.style.top = pos.y + 'px';
        el.style.background = TILE_COLORS[t.value] || '#111';
        el.style.color = (t.value <= 4 || TILE_TEXT_LIGHT.has(t.value)) ? (t.value <=4 ? '#5a5346' : '#eee') : '#1a1a2e';
        const fontSize = t.value >= 1000 ? pos.size * 0.32 : pos.size * 0.4;
        el.style.fontSize = fontSize + 'px';
        el.textContent = t.value;
        if (!skipAnim && t.isNew) el.classList.add('new-tile');
        if (!skipAnim && t.merged) el.classList.add('merged-tile');
        tileLayer.appendChild(el);
        t.isNew = false;
        t.merged = false;
      }
    }
  }

  function cloneGridValues() {
    return grid.map(row => row.map(t => t ? t.value : null));
  }

  function slideLine(cells) {
    // cells: array of tile-or-null, length SIZE, returns {result, moved, mergedCount, gained}
    const filtered = cells.filter(t => t);
    const result = [];
    let moved = false;
    let mergedCount = 0;
    let gained = 0;
    let i = 0;
    while (i < filtered.length) {
      const cur = filtered[i];
      const next = filtered[i + 1];
      if (next && next.value === cur.value) {
        const newVal = cur.value * 2;
        result.push({ value: newVal, id: cur.id, merged: true, isNew: false });
        gained += newVal;
        mergedCount++;
        i += 2;
      } else {
        result.push({ value: cur.value, id: cur.id, merged: false, isNew: false });
        i += 1;
      }
    }
    while (result.length < SIZE) result.push(null);
    // detect move: compare original positions (non-null cells) vs result mapping is complex;
    // we detect moved by comparing filtered original sequence positions to final non-null sequence
    for (let k = 0; k < SIZE; k++) {
      const orig = cells[k];
      const res = result[k];
      if ((orig && !res) || (!orig && res) || (orig && res && (orig.value !== res.value))) {
        moved = true;
      }
    }
    return { result, moved, mergedCount, gained };
  }

  function getLine(dir, index) {
    // dir: 'left','right','up','down'; returns array of cells in order from origin edge
    const cells = [];
    if (dir === 'left' || dir === 'right') {
      for (let c = 0; c < SIZE; c++) cells.push(grid[index][c]);
      if (dir === 'right') cells.reverse();
    } else {
      for (let r = 0; r < SIZE; r++) cells.push(grid[r][index]);
      if (dir === 'down') cells.reverse();
    }
    return cells;
  }

  function setLine(dir, index, line) {
    if (dir === 'right') line = line.slice().reverse();
    if (dir === 'down') line = line.slice().reverse();
    if (dir === 'left' || dir === 'right') {
      for (let c = 0; c < SIZE; c++) grid[index][c] = line[c];
    } else {
      for (let r = 0; r < SIZE; r++) grid[r][index] = line[r];
    }
  }

  function move(dir) {
    if (animating || gameOver) return;
    let anyMoved = false;
    let totalMerges = 0;
    let totalGained = 0;

    for (let i = 0; i < SIZE; i++) {
      const line = getLine(dir, i);
      const { result, moved, mergedCount, gained } = slideLine(line);
      if (moved) anyMoved = true;
      totalMerges += mergedCount;
      totalGained += gained;
      setLine(dir, i, result);
    }

    if (!anyMoved) return;

    if (totalMerges > 0) {
      combo += 1;
      if (combo > bestCombo) bestCombo = combo;
    } else {
      combo = 1;
    }
    score += totalGained * combo;
    updateScore();
    updateComboBadge(totalMerges > 0);

    animating = true;
    spawnTile(false);
    render(false);
    checkWinLose();

    setTimeout(() => { animating = false; }, 130);
  }

  function hasMoves() {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (!grid[r][c]) return true;
        const v = grid[r][c].value;
        if (c < SIZE - 1 && grid[r][c + 1] && grid[r][c + 1].value === v) return true;
        if (r < SIZE - 1 && grid[r + 1][c] && grid[r + 1][c].value === v) return true;
      }
    }
    return false;
  }

  function checkWinLose() {
    if (!won) {
      for (let r = 0; r < SIZE; r++)
        for (let c = 0; c < SIZE; c++)
          if (grid[r][c] && grid[r][c].value >= 2048) { won = true; }
      if (won) {
        showOverlay(true);
        return;
      }
    }
    if (!hasMoves()) {
      gameOver = true;
      showOverlay(false);
    }
  }

  function showOverlay(isWin) {
    overlayTitle.textContent = isWin ? '¡Llegaste a 2048!' : 'Juego terminado';
    overlaySub.textContent = 'Puntaje: ' + score + '  ·  Mejor combo: x' + bestCombo;
    overlayBtn.textContent = isWin ? 'Seguir jugando' : 'Intentar de nuevo';
    overlay.classList.add('show');
    overlayBtn.onclick = () => {
      if (isWin) {
        overlay.classList.remove('show');
        gameOver = false;
      } else {
        startGame();
      }
    };
  }

  // Keyboard controls
  window.addEventListener('keydown', (e) => {
    const map = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };
    if (map[e.key]) {
      e.preventDefault();
      move(map[e.key]);
    }
  });

  // Touch/swipe controls
  let touchStartX = 0, touchStartY = 0;
  boardEl.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
  }, { passive: true });
  boardEl.addEventListener('touchend', (e) => {
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    const absX = Math.abs(dx), absY = Math.abs(dy);
    const threshold = 24;
    if (Math.max(absX, absY) < threshold) return;
    if (absX > absY) {
      move(dx > 0 ? 'right' : 'left');
    } else {
      move(dy > 0 ? 'down' : 'up');
    }
  }, { passive: true });

  newGameBtn.addEventListener('click', startGame);
  window.addEventListener('resize', () => render(true));

  startGame();
})();
</script>
</body>
</html>
